<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logotip ko‘rinishi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div id="preview" class="preview">
      <div class="placeholder">
        <span>J</span>
        <p>Logotipingizni yuklang</p>
      </div>
    </div>

    <h1>Logotipingizni ko‘ring</h1>
    <p class="description">Logotip fayli hozircha menda mavjud emas. Uni tanlang va shu yerda ko‘ring.</p>

    <label class="upload-button" for="logoInput">Logotipni tanlash</label>
    <input id="logoInput" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
    <button id="removeButton" class="remove-button" type="button" hidden>Olib tashlash</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
